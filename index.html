<!doctype html>
<html lang="fr-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Today's Mood</title>
  <meta name="theme-color" content="#17130F">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Narrow:wght@500;600&family=Bebas+Neue&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <h1>Today's Mood</h1>
    <div class="entete-actions">
      <button type="button" id="btn-sync" class="etat-sync" data-code="inconnu">…</button>
      <button type="button" id="btn-historique" class="bouton-icone" aria-label="Historique"></button>
      <button type="button" id="btn-reglages" class="bouton-icone" aria-label="Réglages"></button>
    </div>
  </header>

  <div class="barre-collante">
    <div class="selecteur-date">
      <button type="button" id="jour-prec" class="bouton-rond" aria-label="Jour précédent"></button>
      <button type="button" id="date-bouton" class="date-bouton" aria-label="Choisir une date">
        <span id="date-relatif" class="date-relatif"></span>
        <span id="date-libelle" class="date-libelle"></span>
      </button>
      <input type="date" id="date-input" class="date-input" tabindex="-1" aria-hidden="true">
      <button type="button" id="jour-suiv" class="bouton-rond" aria-label="Jour suivant"></button>
    </div>
    <button type="button" id="retour-aujourdhui" class="retour-aujourdhui" hidden>Revenir à aujourd'hui</button>
    <nav id="onglets" class="onglets" role="tablist" aria-label="Parties de la fiche"></nav>
  </div>

  <main id="contenu" role="tabpanel"></main>

  <p class="pied">Version <span id="version"></span></p>

  <script src="db.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
